name: Build PS4 Local Server APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PS4LocalServer-GitHub-Actions.zip'
      - '.github/workflows/android-build.yml'
      - 'Afterglow-overlay/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q PS4LocalServer-GitHub-Actions.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply Afterglow redesign
        run: |
          cp -R Afterglow-overlay/. "$PROJECT_DIR"/
          echo "Afterglow interface, branding and launcher icon applied."

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()
          marker = "    defaultConfig {"
          block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if marker not in s:
              raise SystemExit("Impossible de trouver defaultConfig dans app/build.gradle.kts")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4LocalServer-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
