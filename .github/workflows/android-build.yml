name: Build PS4 Local Server APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PS4LocalServer-GitHub-Actions.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q PS4LocalServer-GitHub-Actions.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin Android text field property
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/fr/local/ps4server/MainActivity.kt"
          s = p.read_text()
          import re
          lines = s.splitlines()
          fixed = []
          for line in lines:
              m = re.match(r"^(\\s*)singleLine\\s*=\\s*(.*?)(,?)\\s*$", line)
              if m:
                  line = f"{m.group(1)}setSingleLine({m.group(2)}){m.group(3)}"
              fixed.append(line)
          p.write_text("\\n".join(fixed) + "\\n")
          print("\\n".join(f"{i+1}: {line}" for i, line in enumerate(fixed) if "SingleLine" in line or "singleLine" in line))
          PY

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()
          marker = "    defaultConfig {"
          block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if marker not in s:
              raise SystemExit("Impossible de trouver defaultConfig dans app/build.gradle.kts")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4LocalServer-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
